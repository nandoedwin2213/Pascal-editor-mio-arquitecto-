services:
  editor:
    build: .
    ports:
      # Keep the container port at 3000. `/scenes` fetches its own API through a
      # base URL that only `NEXT_PUBLIC_APP_URL` can override, and Next inlines
      # that at build time — so a remapped host port 500s the page.
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Public editor origin used by Mint OAuth and same-origin checks.
      MINT_PASCAL_HOST_ORIGIN: ${MINT_PASCAL_HOST_ORIGIN:-http://localhost:3000}
      # Scene database location. Without the volume below, every saved project is
      # discarded when the container is recreated.
      PASCAL_DATA_DIR: /data
      # Browser origins allowed to call the scene API when a reverse proxy
      # forwards requests with a loopback Host header.
      PASCAL_SCENE_API_ORIGINS: ${PASCAL_SCENE_API_ORIGINS:-}
      # Shared password required to open the app. Leave empty to keep it public.
      QUINDE_ACCESS_PASSWORD: ${QUINDE_ACCESS_PASSWORD:-}
      # Signs the public read-only share links (/compartir). Leave empty to disable sharing.
      QUINDE_SHARE_SECRET: ${QUINDE_SHARE_SECRET:-}
      # Enables the in-editor design assistant. Leave empty to hide it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      QUINDE_AI_MODEL: ${QUINDE_AI_MODEL:-}
    volumes:
      - pascal-data:/data
    restart: unless-stopped

volumes:
  pascal-data:
